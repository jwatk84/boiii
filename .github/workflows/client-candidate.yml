name: Build personal client candidate

on:
  push:
    branches: [fps150-client-cap]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-client-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'jwatk84/boiii'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Use LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out exact candidate source
        uses: actions/checkout@v4.2.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
          lfs: false

      - name: Verify source and recursive submodules
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -ne $env:GITHUB_SHA) {
            throw 'Checkout does not match the workflow source revision'
          }
          $submodules = @(git submodule status --recursive)
          if ($LASTEXITCODE -ne 0 -or @($submodules | Where-Object { $_ -match '^[+\-U]' }).Count -ne 0) {
            throw 'Recursive submodules do not match the recorded source'
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        run: tools/premake5 vs2022 --no-check

      - name: Build Release x64
        run: |
          msbuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 /fl '/flp:logfile=build/client-candidate.log;verbosity=normal' build/boiii.sln
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }

      - name: Package unapproved candidate and hashes
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE 'client-candidate'
          $payload = Join-Path $candidateRoot 'payload'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          Copy-Item 'build/bin/x64/Release/boiii.exe' (Join-Path $payload 'boiii.exe')
          Copy-Item 'extension/ext.dll' (Join-Path $payload 'ext.dll')
          Copy-Item 'data' (Join-Path $payload 'data') -Recurse

          $files = @(Get-ChildItem -Path $payload -File -Recurse -Force | Sort-Object FullName | ForEach-Object {
            [ordered]@{
              path = [IO.Path]::GetRelativePath($payload, $_.FullName).Replace('\', '/')
              bytes = $_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $archive = Join-Path $candidateRoot 'boiii-client-candidate.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($payload, $archive, [IO.Compression.CompressionLevel]::Optimal, $false)
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -ne $env:GITHUB_SHA) { throw 'Source revision changed during build' }
          $sourceTree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record source tree' }
          $submodules = @(git submodule status --recursive)
          if ($LASTEXITCODE -ne 0 -or @($submodules | Where-Object { $_ -match '^[+\-U]' }).Count -ne 0) { throw 'Submodule revision changed during build' }
          $manifest = [ordered]@{
            schema = 'eroded-personal-client-candidate-v1'
            approved = $false
            purpose = 'client validation only'
            repository = $env:GITHUB_REPOSITORY
            source_sha = $sourceSha
            source_tree = $sourceTree
            ref = $env:GITHUB_REF
            event = $env:GITHUB_EVENT_NAME
            workflow = $env:GITHUB_WORKFLOW_REF
            workflow_sha = $env:GITHUB_WORKFLOW_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            built_at_utc = [DateTime]::UtcNow.ToString('o')
            configuration = 'Release'
            platform = 'x64'
            submodules = $submodules
            files = $files
            archive = [ordered]@{
              name = 'boiii-client-candidate.zip'
              bytes = (Get-Item $archive).Length
              sha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $candidateRoot 'candidate-manifest.json') -Encoding utf8NoBOM

      - name: Upload candidate for review
        uses: actions/upload-artifact@v4.4.0
        with:
          name: boiii-client-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            client-candidate/boiii-client-candidate.zip
            client-candidate/candidate-manifest.json
            build/client-candidate.log
          if-no-files-found: error
          retention-days: 7
